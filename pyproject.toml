[project]
name = "s1-workflows"
version = "0.1.0"
description = "Fast structured pull-request risk assessment using Jev or Clef"
requires-python = ">=3.11"

[project.scripts]
s1-assess = "s1_workflows.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["s1_workflows*"]
