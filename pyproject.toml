[project]
name = "jev-workflows"
version = "0.1.0"
description = "Fast structured pull-request risk assessment using TypeSafe Jev"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_workflows*"]
